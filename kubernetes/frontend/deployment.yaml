apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopsphere
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 992839646359.dkr.ecr.ap-south-1.amazonaws.com/dev-shopsphere:frontend-1.0
        imagePullPolicy: Always
        ports:
         - containerPort: 80
           protocol: TCP
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests: 
            memory: "128Mi"
            cpu: "100m"
