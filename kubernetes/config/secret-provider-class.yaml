apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shopsphere-secrets
  namespace: shopsphere
spec:
  provider: aws

  parameters:
    objects: |
      - objectName: "<RDS_MASTER_USER_SECRET_ARN replace it with arn after the insfra is created >"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "POSTGRES_USER"
          - path: "password"
            objectAlias: "POSTGRES_PASSWORD"

      - objectName: "<JWT_SECRET_ARN replace it with arn after the infra is created >"
        objectType: "secretsmanager"
        objectAlias: "JWT_SECRET"

  secretObjects:
    - secretName: shopsphere-secrets
      type: Opaque
      data:
        - objectName: POSTGRES_USER
          key: POSTGRES_USER
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: JWT_SECRET
          key: JWT_SECRET